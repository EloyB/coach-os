<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2D5016" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#2D5016" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2D5016" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="#0F1513"/>
  <rect width="1584" height="396" fill="url(#glow)"/>

  <!-- Tennis court (anatomically correct, stretched to full banner width) -->
  <g opacity="0.10" stroke="#FFFFFF" fill="none">
    <!-- Doubles court: outer rect (doubles sidelines top/bottom + baselines left/right) -->
    <rect x="20" y="22" width="1544" height="352" stroke-width="2"/>
    <!-- Singles sidelines (inside the doubles alleys, parallel to long sides) -->
    <line x1="20" y1="66"  x2="1564" y2="66"  stroke-width="1"/>
    <line x1="20" y1="330" x2="1564" y2="330" stroke-width="1"/>
    <!-- Net (vertical line in middle, spans full court width including alleys) -->
    <line x1="792" y1="22" x2="792" y2="374" stroke-width="2.5"/>
    <!-- Service lines (parallel to net, ~54% of net-to-baseline distance) -->
    <line x1="375" y1="66" x2="375" y2="330" stroke-width="1"/>
    <line x1="1209" y1="66" x2="1209" y2="330" stroke-width="1"/>
    <!-- Center service line (only between the two service lines, divides service boxes) -->
    <line x1="375" y1="198" x2="1209" y2="198" stroke-width="1"/>
    <!-- Center marks on baselines (small notches) -->
    <line x1="20"   y1="198" x2="32"   y2="198" stroke-width="2.5"/>
    <line x1="1552" y1="198" x2="1564" y2="198" stroke-width="2.5"/>
  </g>

  <!-- Wordmark centered -->
  <text x="792" y="180" class="sans" font-size="96" font-weight="800" fill="#FFFFFF" letter-spacing="-2.5" text-anchor="middle">Coach<tspan fill="#D0FF14">OS</tspan></text>

  <!-- Stat strip — three punchlines -->
  <g>
    <!-- Stat 1 -->
    <text x="400" y="248" class="sans" font-size="36" font-weight="800" fill="#D0FF14" text-anchor="middle">1 middag</text>
    <text x="400" y="276" class="mono" font-size="11" font-weight="700" fill="#A8A195" letter-spacing="2" text-anchor="middle">HELE SEIZOEN INGEPLAND</text>

    <!-- Divider -->
    <line x1="596" y1="222" x2="596" y2="282" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Stat 2 -->
    <text x="792" y="248" class="mono" font-size="36" font-weight="800" fill="#D0FF14" text-anchor="middle">0</text>
    <text x="792" y="276" class="mono" font-size="11" font-weight="700" fill="#A8A195" letter-spacing="2" text-anchor="middle">EXCEL-SHEETS NODIG</text>

    <!-- Divider -->
    <line x1="988" y1="222" x2="988" y2="282" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Stat 3 -->
    <text x="1184" y="248" class="sans" font-size="36" font-weight="800" fill="#D0FF14" text-anchor="middle">1 tool</text>
    <text x="1184" y="276" class="mono" font-size="11" font-weight="700" fill="#A8A195" letter-spacing="2" text-anchor="middle">PLAN · INSCHRIJF · BETAAL</text>
  </g>

  <!-- Bottom-right URL -->
  <text x="1524" y="356" class="mono" font-size="20" font-weight="700" fill="#A8A195" letter-spacing="2" text-anchor="end">
    coach-os.be
  </text>

  <!-- Lime accent stripe at far right edge -->
  <rect x="1572" y="0" width="12" height="396" fill="#D0FF14"/>
</svg>
