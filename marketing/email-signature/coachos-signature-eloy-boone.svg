  <text x="70" y="47" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.4">Coach<tspan fill="#D0FF14">OS</tspan></text>

  <!-- Slash role -->
  <text x="22" y="87" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#D0FF14" letter-spacing="2.4">/FOUNDER</text>

  <!-- Name -->
