  <!-- WEB column -->
  <text x="320" y="174" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#8A8377" letter-spacing="2.2">WEB</text>
