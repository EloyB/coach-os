<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <title>CoachOS — Eloy Boone</title>
  <!-- Background -->
  <rect width="540" height="240" fill="#161513"/>
  
    <g stroke="#fff" stroke-opacity="0.07" fill="none" stroke-linecap="round">
      <rect x="36" y="24" width="468" height="192" stroke-width="1.5"/>
      <line x1="270" y1="24" x2="270" y2="216" stroke-width="2"/>
      <line x1="145.8" y1="24" x2="145.8" y2="216" stroke-width="0.8"/>
      <line x1="394.2" y1="24" x2="394.2" y2="216" stroke-width="0.8"/>
      <line x1="145.8" y1="120" x2="394.2" y2="120" stroke-width="0.8"/>
      <line x1="266" y1="24" x2="274" y2="24" stroke-width="2"/>
      <line x1="266" y1="216" x2="274" y2="216" stroke-width="2"/>
      <circle cx="490" cy="52.8" r="28" stroke-width="0.8"/>
      <circle cx="490" cy="52.8" r="16" stroke-width="0.8"/>
    </g>
  <!-- Lime accent strip (right edge) -->
  <rect x="534" y="0" width="6" height="240" fill="#D0FF14"/>

