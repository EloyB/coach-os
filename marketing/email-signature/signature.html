<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>CoachOS · Email signature</title>
  </head>
  <body>
    <!--
  ─────────────────────────────────────────────────────────────────
  CoachOS email signature — paste the outer <table> below into
  your email client's signature editor and replace the
  {{PLACEHOLDERS}}.

  Design echoes the CoachOS business card FRONT: ink background,
  subtle white tennis-court pattern, lime monogram tile, white +
  lime wordmark, slash-label role in lime, tagline in warm off-
  white, CONTACT / WEB columns, and a lime vertical accent strip
  on the right edge.

  Court pattern: base64-inlined SVG on the cell background. Works
  in Gmail (web/mobile), Apple Mail, iOS Mail, Outlook web, Yahoo.
  Outlook desktop on Windows strips CSS backgrounds — recipients
  there see the plain ink color (the `bgcolor` attribute is the
  reliable fallback). Inline SVG monogram + wordmark text still
  render there, so the brand identity is preserved.
  ─────────────────────────────────────────────────────────────────
-->

    <!-- ── BEGIN signature snippet ────────────────────────────────── -->
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      role="presentation"
      style="
        border-collapse: collapse;
        background: #161513;
        font-family:
          -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
          &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;
        color: #ffffff;
      "
    >
      <tr>
        <!-- ── Content cell ──────────────────────────────────────── -->
        <td
          valign="top"
          bgcolor="#161513"
          style="
            padding: 20px 24px 20px 22px;
            vertical-align: top;
            background-color: #161513;
            background-image: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2MDAgMjAwJyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSd4TWlkWU1pZCBzbGljZSc+PGcgc3Ryb2tlPScjZmZmJyBzdHJva2Utb3BhY2l0eT0nLjA3JyBmaWxsPSdub25lJyBzdHJva2UtbGluZWNhcD0ncm91bmQnPjxyZWN0IHg9JzQwJyB5PScyMCcgd2lkdGg9JzUyMCcgaGVpZ2h0PScxNjAnIHN0cm9rZS13aWR0aD0nMS41Jy8+PGxpbmUgeDE9JzMwMCcgeTE9JzIwJyB4Mj0nMzAwJyB5Mj0nMTgwJyBzdHJva2Utd2lkdGg9JzInLz48bGluZSB4MT0nMTYwJyB5MT0nMjAnIHgyPScxNjAnIHkyPScxODAnIHN0cm9rZS13aWR0aD0nLjgnLz48bGluZSB4MT0nNDQwJyB5MT0nMjAnIHgyPSc0NDAnIHkyPScxODAnIHN0cm9rZS13aWR0aD0nLjgnLz48bGluZSB4MT0nMTYwJyB5MT0nMTAwJyB4Mj0nNDQwJyB5Mj0nMTAwJyBzdHJva2Utd2lkdGg9Jy44Jy8+PGxpbmUgeDE9JzI5NicgeTE9JzIwJyB4Mj0nMzA0JyB5Mj0nMjAnIHN0cm9rZS13aWR0aD0nMicvPjxsaW5lIHgxPScyOTYnIHkxPScxODAnIHgyPSczMDQnIHkyPScxODAnIHN0cm9rZS13aWR0aD0nMicvPjxjaXJjbGUgY3g9JzU0MCcgY3k9JzUwJyByPScyOCcgc3Ryb2tlLXdpZHRoPScuOCcvPjxjaXJjbGUgY3g9JzU0MCcgY3k9JzUwJyByPScxNicgc3Ryb2tlLXdpZHRoPScuOCcvPjwvZz48L3N2Zz4K);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
          "
        >
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            role="presentation"
            style="border-collapse: collapse"
          >
            <!-- Brand row: monogram + wordmark -->
            <tr>
              <td
                align="center"
                valign="middle"
                width="40"
                height="40"
                style="
                  width: 40px;
                  height: 40px;
                  background: #d0ff14;
                  border-radius: 7px;
                  text-align: center;
                  vertical-align: middle;
                  line-height: 0;
                  font-size: 0;
                "
              >
                <a
                  href="https://coach-os.be"
                  style="
                    text-decoration: none;
                    border: 0;
                    display: inline-block;
                    line-height: 0;
                  "
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="28"
                    height="28"
                    viewBox="0 0 108 108"
                    style="display: block"
                    aria-label="CoachOS"
                  >
                    <g
                      stroke="#161513"
                      stroke-width="7"
                      fill="none"
                      stroke-linecap="round"
                    >
                      <circle cx="54" cy="54" r="28" />
                      <path
                        d="M 28 54 C 36 42, 44 42, 54 54 C 64 66, 72 66, 80 54"
                      />
                    </g>
                  </svg>
                </a>
              </td>
              <td
                valign="middle"
                style="
                  vertical-align: middle;
                  padding-left: 8px;
                  font-size: 20px;
                  font-weight: 700;
                  color: #ffffff;
                  letter-spacing: -0.02em;
                  line-height: 1;
                "
              >
                Coach<span style="color: #d0ff14">OS</span>
              </td>
            </tr>

            <!-- Slash role -->
            <tr>
              <td
                colspan="2"
                style="
                  padding: 18px 0 0 0;
                  font-family:
                    ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo,
                    Consolas, monospace;
                  font-size: 11px;
                  font-weight: 700;
                  color: #d0ff14;
                  letter-spacing: 0.22em;
                  line-height: 1;
                "
              >
                /CO-FOUNDER
              </td>
            </tr>

            <!-- Name -->
            <tr>
              <td
                colspan="2"
                style="
                  padding: 8px 0 0 0;
                  font-size: 24px;
                  font-weight: 800;
                  color: #ffffff;
                  letter-spacing: -0.02em;
                  line-height: 1.1;
                "
              >
                Eloy Boone
              </td>
            </tr>

            <!-- Tagline -->
            <tr>
              <td
                colspan="2"
                style="
                  padding: 4px 0 0 0;
                  font-size: 13px;
                  font-weight: 500;
                  color: #a8a195;
                  line-height: 1.4;
                "
              >
                Lesplanning, eindelijk eenvoudig.
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td colspan="2" style="padding: 14px 0 12px 0">
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  role="presentation"
                  style="border-collapse: collapse; width: 100%"
                >
                  <tr>
                    <td
                      style="
                        height: 1px;
                        line-height: 1px;
                        background: #2a2826;
                        font-size: 0;
                      "
                    >
                      &nbsp;
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- CONTACT / WEB columns -->
            <tr>
              <td colspan="2">
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  role="presentation"
                  style="border-collapse: collapse"
                >
                  <tr>
                    <!-- CONTACT column -->
                    <td
                      valign="top"
                      style="vertical-align: top; padding: 0 36px 0 0"
                    >
                      <div
                        style="
                          font-family:
                            ui-monospace, SFMono-Regular, &quot;SF Mono&quot;,
                            Menlo, Consolas, monospace;
                          font-size: 10px;
                          font-weight: 700;
                          color: #8a8377;
                          letter-spacing: 0.22em;
                          line-height: 1;
                          margin-bottom: 6px;
                        "
                      >
                        CONTACT
                      </div>
                      <div
                        style="
                          font-size: 13px;
                          font-weight: 600;
                          color: #e9e4db;
                          line-height: 1.45;
                        "
                      >
                        <a
                          href="mailto:eloy@coach-os.be"
                          style="color: #e9e4db; text-decoration: none"
                          >eloy@coach-os.be</a
                        >
                      </div>
                      <!-- Phone (optional — delete this <div> if not used) -->
                      <div
                        style="
                          font-family:
                            ui-monospace, SFMono-Regular, &quot;SF Mono&quot;,
                            Menlo, Consolas, monospace;
                          font-size: 12px;
                          font-weight: 600;
                          color: #e9e4db;
                          line-height: 1.5;
                        "
                      >
                        <a
                          href="tel:+32478774497"
                          style="color: #e9e4db; text-decoration: none"
                          >+32 478 77 44 97</a
                        >
                      </div>
                    </td>

                    <!-- WEB column -->
                    <td valign="top" style="vertical-align: top">
                      <div
                        style="
                          font-family:
                            ui-monospace, SFMono-Regular, &quot;SF Mono&quot;,
                            Menlo, Consolas, monospace;
                          font-size: 10px;
                          font-weight: 700;
                          color: #8a8377;
                          letter-spacing: 0.22em;
                          line-height: 1;
                          margin-bottom: 6px;
                        "
                      >
                        WEB
                      </div>
                      <div
                        style="
                          font-family:
                            ui-monospace, SFMono-Regular, &quot;SF Mono&quot;,
                            Menlo, Consolas, monospace;
                          font-size: 13px;
                          font-weight: 700;
                          color: #e9e4db;
                          line-height: 1.45;
                        "
                      >
                        <a
                          href="https://coach-os.be"
                          style="color: #e9e4db; text-decoration: none"
                          >coach-os.be</a
                        >
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>

        <!-- ── Lime accent strip (right edge) ────────────────────── -->
        <td
          bgcolor="#D0FF14"
          style="width: 6px; background: #d0ff14; font-size: 0; line-height: 0"
        >
          &nbsp;
        </td>
      </tr>
    </table>
    <!-- ── END signature snippet ──────────────────────────────────── -->
  </body>
</html>
