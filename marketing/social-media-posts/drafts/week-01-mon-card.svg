<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&amp;family=JetBrains+Mono:wght@600;700;800&amp;display=swap');
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#161513"/>

  <!-- Court pattern -->
  <g opacity="0.07" stroke="#ffffff" fill="none">
    <rect x="90" y="90" width="900" height="850" stroke-width="2.5"/>
    <line x1="540" y1="90" x2="540" y2="940" stroke-width="3"/>
    <line x1="285" y1="90" x2="285" y2="940" stroke-width="1.2"/>
    <line x1="795" y1="90" x2="795" y2="940" stroke-width="1.2"/>
    <line x1="285" y1="515" x2="795" y2="515" stroke-width="1.2"/>
    <line x1="533" y1="90" x2="547" y2="90" stroke-width="3"/>
    <line x1="533" y1="940" x2="547" y2="940" stroke-width="3"/>
    <circle cx="900" cy="175" r="92" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="900" cy="175" r="58" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="90" cy="515" r="7" fill="#ffffff" fill-opacity="0.7" stroke="none"/>
    <circle cx="990" cy="515" r="7" fill="#ffffff" fill-opacity="0.7" stroke="none"/>
  </g>

  <!-- Logo monogram top-left -->
  <rect x="80" y="80" width="120" height="120" rx="16" fill="#D0FF14"/>
  <g stroke="#161513" stroke-width="8" fill="none" stroke-linecap="round">
    <circle cx="140" cy="140" r="32"/>
    <path d="M 110 140 C 119 127, 128 127, 140 140 C 152 153, 161 153, 170 140"/>
  </g>

  <!-- Hero statement -->
  <text x="80" y="485" class="sans" font-weight="800" font-size="120" fill="#ffffff" letter-spacing="-4">1 middag<tspan fill="#D0FF14">.</tspan></text>
  <text x="80" y="625" class="sans" font-weight="800" font-size="120" fill="#ffffff" letter-spacing="-4">0 Excel<tspan fill="#D0FF14">.</tspan></text>
  <text x="80" y="765" class="sans" font-weight="800" font-size="120" fill="#ffffff" letter-spacing="-4">1 tool<tspan fill="#D0FF14">.</tspan></text>

  <!-- Divider -->
  <line x1="80" y1="855" x2="1000" y2="855" stroke="#D0FF14" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Bottom tagline left -->
  <text x="86" y="930" class="sans" font-weight="600" font-size="30" fill="#D0FF14" letter-spacing="-0.3">Een lessenseizoen in één middag.</text>

  <!-- Bottom URL right -->
  <text x="1000" y="930" class="mono" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="4" text-anchor="end">coach-os.be</text>

  <!-- Lime accent strip bottom -->
  <rect x="0" y="1032" width="1080" height="48" fill="#D0FF14"/>
</svg>
