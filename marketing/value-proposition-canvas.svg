<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1800" height="1100" fill="#fdfcf9"/>
  <rect width="1800" height="8" fill="#D0FF14"/>

  <!-- Title block -->
  <text x="40" y="64" class="mono" font-size="13" font-weight="700" fill="#8a867e" letter-spacing="3">VALUE PROPOSITION CANVAS · COACHOS</text>
  <text x="40" y="100" class="sans" font-size="36" font-weight="800" fill="#161513" letter-spacing="-1">Hoe CoachOS waarde levert aan trainers</text>
  <text x="40" y="128" class="sans" font-size="16" font-weight="500" fill="#4a4741">
    Concept v1 — gebaseerd op de huidige product- en doelgroephypothese. Te valideren met pilotgebruikers.
  </text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEFT PANEL — VALUE MAP (what CoachOS offers)                        -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(40, 160)">
    <rect width="850" height="900" rx="14" fill="#fdfcf9" stroke="#e7e4dc" stroke-width="2"/>

    <!-- Header bar -->
    <path d="M 0 14 Q 0 0 14 0 L 836 0 Q 850 0 850 14 L 850 64 L 0 64 Z" fill="#2D5016"/>
    <text x="28" y="28" class="mono" font-size="11" font-weight="700" fill="#D0FF14" letter-spacing="3">VALUE MAP</text>
    <text x="28" y="52" class="sans" font-size="20" font-weight="700" fill="#fdfcf9">Wat CoachOS levert</text>
    <rect x="800" y="20" width="28" height="28" rx="4" fill="#D0FF14"/>
    <text x="814" y="40" class="mono" font-size="14" font-weight="800" fill="#161513" text-anchor="middle">▢</text>

    <!-- ─── Gain Creators ───────────────────────────────────────────── -->
    <g transform="translate(0, 88)">
      <rect x="28" width="4" height="32" rx="2" fill="#D0FF14"/>
      <text x="42" y="13" class="mono" font-size="11" font-weight="700" fill="#8a867e" letter-spacing="2.5">GAIN CREATORS</text>
      <text x="42" y="36" class="sans" font-size="22" font-weight="700" fill="#161513">Hoe we voordelen creëren</text>

      <g transform="translate(42, 60)" class="sans" font-size="15" fill="#161513">
        <text y="20">• Een heel seizoen plannen in één middag</text>
        <text y="48">• Hogere bezetting per slot via voorkeurenmatching</text>
        <text y="76">• Professionele uitstraling naar leerlingen en ouders</text>
        <text y="104">• Automatische bevestigingen — niets meer naloeren</text>
        <text y="132">• Gratis tijdens pilot + lifetime korting voor early adopters</text>
        <text y="160">• Directe lijn naar de founder — wensen in de roadmap</text>
      </g>
    </g>

    <line x1="28" y1="340" x2="822" y2="340" stroke="#e7e4dc" stroke-width="1"/>

    <!-- ─── Products & Services ─────────────────────────────────────── -->
    <g transform="translate(0, 360)">
      <rect x="28" width="4" height="32" rx="2" fill="#2D5016"/>
      <text x="42" y="13" class="mono" font-size="11" font-weight="700" fill="#8a867e" letter-spacing="2.5">PRODUCTS &amp; SERVICES</text>
      <text x="42" y="36" class="sans" font-size="22" font-weight="700" fill="#161513">Wat de tool doet</text>

      <g transform="translate(42, 60)" class="sans" font-size="15" fill="#161513">
        <text y="20">• Lesreeksen — terugkerend, één keer ingesteld</text>
        <text y="48">• Anonieme inschrijvingen via publieke link per reeks</text>
        <text y="76">• Formulierbouwer (vrije tekst, meerkeuze, ja/nee)</text>
        <text y="104">• Planningsalgoritme met voorkeur- en niveaumatch</text>
        <text y="132">• Magic-link bevestiging — geen account voor leerlingen</text>
        <text y="160">• Mollie-betalingen (Bancontact + iDEAL, op roadmap)</text>
      </g>
    </g>

    <line x1="28" y1="612" x2="822" y2="612" stroke="#e7e4dc" stroke-width="1"/>

    <!-- ─── Pain Relievers ──────────────────────────────────────────── -->
    <g transform="translate(0, 632)">
      <rect x="28" width="4" height="32" rx="2" fill="#F59E0B"/>
      <text x="42" y="13" class="mono" font-size="11" font-weight="700" fill="#8a867e" letter-spacing="2.5">PAIN RELIEVERS</text>
      <text x="42" y="36" class="sans" font-size="22" font-weight="700" fill="#161513">Hoe we frictie wegnemen</text>

      <g transform="translate(42, 60)" class="sans" font-size="15" fill="#161513">
        <text y="20">• Vervangt Excel — alles in één up-to-date plek</text>
        <text y="48">• Geen e-mailcarrousel — leerlingen vullen zelf in</text>
        <text y="76">• Algoritme groepeert op niveau + voorkeur, niet jij</text>
        <text y="104">• Geen accounts of wachtwoorden voor leerlingen</text>
        <text y="132">• Eén tool: inschrijving → planning → bevestiging → betaling</text>
        <text y="160">• Eén klik herplannen bij afzegging of niveauwissel</text>
      </g>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT PANEL — CUSTOMER PROFILE (the trainer)                        -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(910, 160)">
    <rect width="850" height="900" rx="14" fill="#fdfcf9" stroke="#e7e4dc" stroke-width="2"/>

    <!-- Header bar -->
    <path d="M 0 14 Q 0 0 14 0 L 836 0 Q 850 0 850 14 L 850 64 L 0 64 Z" fill="#161513"/>
    <text x="28" y="28" class="mono" font-size="11" font-weight="700" fill="#D0FF14" letter-spacing="3">CUSTOMER PROFILE</text>
    <text x="28" y="52" class="sans" font-size="20" font-weight="700" fill="#fdfcf9">Trainer / hoofdtrainer · Benelux</text>
    <circle cx="814" cy="34" r="14" fill="#D0FF14"/>
    <circle cx="814" cy="34" r="7" fill="#161513"/>

    <!-- ─── Customer Gains ──────────────────────────────────────────── -->
    <g transform="translate(0, 88)">
      <rect x="28" width="4" height="32" rx="2" fill="#D0FF14"/>
      <text x="42" y="13" class="mono" font-size="11" font-weight="700" fill="#8a867e" letter-spacing="2.5">CUSTOMER GAINS</text>
      <text x="42" y="36" class="sans" font-size="22" font-weight="700" fill="#161513">Wat de trainer wil bereiken</text>

      <g transform="translate(42, 60)" class="sans" font-size="15" fill="#161513">
        <text y="20">• Meer tijd op de baan, minder achter de laptop</text>
        <text y="48">• Een planning die zichzelf bevestigt</text>
        <text y="76">• Voorspelbare seizoensomzet en volle slots</text>
        <text y="104">• Tevreden ouders, zonder verwarring of vragen</text>
        <text y="132">• Modern en professioneel ogen naar buiten</text>
        <text y="160">• Minder mentale ballast — geen losse eindjes</text>
      </g>
    </g>

    <line x1="28" y1="340" x2="822" y2="340" stroke="#e7e4dc" stroke-width="1"/>

    <!-- ─── Customer Jobs ───────────────────────────────────────────── -->
    <g transform="translate(0, 360)">
      <rect x="28" width="4" height="32" rx="2" fill="#2D5016"/>
      <text x="42" y="13" class="mono" font-size="11" font-weight="700" fill="#8a867e" letter-spacing="2.5">CUSTOMER JOBS</text>
      <text x="42" y="36" class="sans" font-size="22" font-weight="700" fill="#161513">Wat de trainer moet doen</text>

      <g transform="translate(42, 60)" class="sans" font-size="15" fill="#161513">
        <text y="20">• Lesreeksen plannen voor een heel seizoen</text>
        <text y="48">• Inschrijvingen verzamelen van leerlingen + ouders</text>
        <text y="76">• Leerlingen matchen op niveau, leeftijd en voorkeur</text>
        <text y="104">• Bevestigingen versturen aan iedereen</text>
        <text y="132">• Betalingen opvolgen per inschrijving</text>
        <text y="160">• Wijzigingen verwerken (afzeggingen, niveauwissels)</text>
      </g>
    </g>

    <line x1="28" y1="612" x2="822" y2="612" stroke="#e7e4dc" stroke-width="1"/>

    <!-- ─── Pains ───────────────────────────────────────────────────── -->
    <g transform="translate(0, 632)">
      <rect x="28" width="4" height="32" rx="2" fill="#DC2626"/>
      <text x="42" y="13" class="mono" font-size="11" font-weight="700" fill="#8a867e" letter-spacing="2.5">PAINS</text>
      <text x="42" y="36" class="sans" font-size="22" font-weight="700" fill="#161513">Wat hem of haar nu frustreert</text>

      <g transform="translate(42, 60)" class="sans" font-size="15" fill="#161513">
        <text y="20">• Excel-sheets die niet meer matchen met de realiteit</text>
        <text y="48">• Eindeloos mailen over voorkeurstijden en niveaus</text>
        <text y="76">• Met de hand puzzelen op groepjes en uurroosters</text>
        <text y="104">• Ouders die geen account willen aanmaken in een app</text>
        <text y="132">• Geen overzicht van wie wel/niet betaald heeft</text>
        <text y="160">• Eén afzegging = het hele schema opnieuw doen</text>
      </g>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- FIT INDICATOR (between the two panels)                              -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(880, 580)">
    <circle cx="20" cy="30" r="22" fill="#fdfcf9" stroke="#e7e4dc" stroke-width="2"/>
    <text x="20" y="22" class="mono" font-size="9" font-weight="700" fill="#8a867e" letter-spacing="1" text-anchor="middle">FIT</text>
    <path d="M 8 36 L 32 36 M 26 30 L 32 36 L 26 42" stroke="#2D5016" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 8 36 L 14 30 M 8 36 L 14 42" stroke="#2D5016" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer brand line -->
  <line x1="40" y1="1080" x2="1760" y2="1080" stroke="#e7e4dc" stroke-width="1"/>
</svg>
