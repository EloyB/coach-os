<svg xmlns="http://www.w3.org/2000/svg" width="85mm" height="55mm" viewBox="0 0 1020 660">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&amp;family=JetBrains+Mono:wght@600;800&amp;display=swap');
      .sans { font-family: 'Inter', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1020" height="660" fill="#161513"/>

  <!-- Subtle court pattern (white at low opacity) -->
  <g opacity="0.07" stroke="#ffffff" fill="none">
    <rect x="80" y="80" width="860" height="500" stroke-width="2"/>
    <line x1="510" y1="80" x2="510" y2="580" stroke-width="2.5"/>
    <line x1="240" y1="80" x2="240" y2="580" stroke-width="1"/>
    <line x1="780" y1="80" x2="780" y2="580" stroke-width="1"/>
    <line x1="240" y1="330" x2="780" y2="330" stroke-width="1"/>
    <line x1="505" y1="80" x2="515" y2="80" stroke-width="2.5"/>
    <line x1="505" y1="580" x2="515" y2="580" stroke-width="2.5"/>
    <circle cx="850" cy="130" r="80" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="850" cy="130" r="50" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="80" cy="330" r="6" fill="#ffffff" fill-opacity="0.7" stroke="none"/>
    <circle cx="940" cy="330" r="6" fill="#ffffff" fill-opacity="0.7" stroke="none"/>
  </g>

  <!-- Eyebrow top-right -->
  <text x="960" y="100" class="mono" font-size="22" fill="#D0FF14" letter-spacing="3.6" text-anchor="end">
    LESPLANNING / BENELUX
  </text>

  <!-- Logo monogram top-left -->
  <rect x="60" y="60" width="108" height="108" rx="14" fill="#D0FF14"/>
  <g stroke="#161513" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="114" cy="114" r="28"/>
    <path d="M 88 114 C 96 102, 104 102, 114 114 C 124 126, 132 126, 140 114"/>
  </g>

  <!-- Wordmark + tagline bottom-left -->
  <text x="60" y="510" class="sans" font-weight="800" font-size="92" fill="#ffffff" letter-spacing="-2.5">Coach<tspan fill="#D0FF14">OS</tspan></text>
  <text x="64" y="568" class="sans" font-weight="600" font-size="30" fill="#D0FF14" letter-spacing="-0.2">
    Een planning die zichzelf bevestigt.
  </text>

  <!-- Lime accent strip bottom edge -->
  <rect x="0" y="640" width="1020" height="20" fill="#D0FF14"/>
</svg>
