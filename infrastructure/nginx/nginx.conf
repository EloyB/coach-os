user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format includes the X-Correlation-Id header set by the API so request
    # traces can be joined across nginx logs and application logs.
    log_format main_with_correlation '$remote_addr - $remote_user [$time_local] '
                                     '"$request" $status $body_bytes_sent '
                                     '"$http_referer" "$http_user_agent" '
                                     'cid=$http_x_correlation_id rt=$request_time';

    access_log /var/log/nginx/access.log main_with_correlation;

    # Use Docker's embedded DNS so upstream hostnames re-resolve at runtime
    # (avoids stale "no such host" caching when containers are added/restarted).
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 25m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limit zones — burst handled per-location below.
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=front_zone:10m rate=1000r/m;

    include /etc/nginx/conf.d/*.conf;
}
