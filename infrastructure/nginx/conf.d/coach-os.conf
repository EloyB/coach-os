# HTTP → HTTPS redirect (and ACME http-01 challenge passthrough)
server {
    listen 80;
    listen [::]:80;
    server_name coach-os.be www.coach-os.be;

    # certbot --webroot uses this path; we mount /var/www/certbot from the host.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS vhost
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coach-os.be www.coach-os.be;

    ssl_certificate     /etc/letsencrypt/live/coach-os.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coach-os.be/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # HSTS: tell browsers to never speak plain HTTP to this host. 1 year.
    # Submit to the HSTS preload list once you're confident nothing breaks.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API ──────────────────────────────────────────────────────────────────

    # Stricter rate limit for /api/auth/* to slow credential-stuffing.
    location ~ ^/api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 60s;
    }

    # Health endpoint without rate limiting (for uptime monitors).
    location = /api/health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Dozzle (live container log viewer) ───────────────────────────────────
    # Dozzle handles its own basic auth via DOZZLE_USERNAME/PASSWORD env vars;
    # nginx just proxies (with WebSocket upgrade for live tail).
    location /_logs/ {
        # Variable forces nginx to use the runtime resolver rather than caching
        # DNS at config-load time (otherwise nginx 502s if dozzle was added
        # after this nginx container started).
        set $dozzle_upstream "dozzle:8080";
        proxy_pass http://$dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # long-lived WebSocket for live log tail
        access_log off;
    }

    # ── Frontend ─────────────────────────────────────────────────────────────

    location / {
        limit_req zone=front_zone burst=50 nodelay;
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
