# ─────────────────────────────────────────────────────────────────────────────
# coach-os.be    + www → marketing website (Next.js SSR container "website")
# app.coach-os.be       → CoachOS app      (Next.js SSR container "frontend")
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect (and ACME http-01 challenge passthrough) for all hosts.
server {
    listen 80;
    listen [::]:80;
    server_name coach-os.be www.coach-os.be app.coach-os.be;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Apex + www: marketing website ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coach-os.be www.coach-os.be;

    ssl_certificate     /etc/letsencrypt/live/coach-os.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coach-os.be/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permanent redirects for paths that used to live on the apex but moved
    # to the app subdomain. Keeps old emails / bookmarks working.
    location ~ ^/(login|register|dashboard|confirmation|auth|invitation)(/|$) {
        return 301 https://app.coach-os.be$request_uri;
    }

    # Marketing site (Next.js SSR container).
    location / {
        limit_req zone=front_zone burst=50 nodelay;
        set $website_upstream "website:3000";
        proxy_pass http://$website_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── App subdomain: Next.js app + API + dozzle ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.coach-os.be;

    ssl_certificate     /etc/letsencrypt/live/coach-os.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coach-os.be/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # All upstreams use a variable so nginx resolves DNS at request time
    # via the global resolver in nginx.conf. Without this, nginx refuses
    # to boot if any single upstream container is temporarily down.

    # ── API ──────────────────────────────────────────────────────────────────

    # Stricter rate limit for /api/auth/* to slow credential-stuffing.
    location ~ ^/api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        set $api_upstream "api:8080";
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        set $api_upstream "api:8080";
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 60s;
    }

    # Health endpoint without rate limiting (for uptime monitors).
    location = /api/health {
        set $api_upstream "api:8080";
        proxy_pass http://$api_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Dozzle (live container log viewer) ───────────────────────────────────
    location /_logs/ {
        set $dozzle_upstream "dozzle:8080";
        proxy_pass http://$dozzle_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        access_log off;
    }

    # ── Grafana (authenticated log search) ───────────────────────────────────
    # Exacte match wint van de prefix-location hieronder, ongeacht volgorde:
    # enkel de login-pagina/-post krijgt de strenge auth_zone (zelfde rate als
    # /api/auth/), zodat brute-force op het wachtwoord afgeremd wordt zonder de
    # SPA's eigen assets/API/live-websocket (die via dezelfde prefix lopen) mee
    # te limiteren — dat laatste veroorzaakte 503's/chunkNotFound op elke load.
    location = /_grafana/login {
        limit_req zone=auth_zone burst=5 nodelay;
        set $grafana_upstream "grafana:3000";
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /_grafana;
        proxy_read_timeout 60s;
    }

    location /_grafana/ {
        limit_req zone=grafana_zone burst=60 nodelay;
        set $grafana_upstream "grafana:3000";
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        # Grafana Live (/api/live/ws) needs the upgrade headers, same as the
        # frontend and Dozzle locations — without them ws requests 400 in a loop.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /_grafana;
        proxy_read_timeout 60s;
    }

    # ── Frontend (the actual app) ────────────────────────────────────────────
    location / {
        limit_req zone=front_zone burst=50 nodelay;
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
