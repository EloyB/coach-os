# Production compose for coach-os, deployed to /app on the Scaleway VPS by
# .github/workflows/deploy-infra.yml. Secrets are written to /app/.env by the
# deploy job (sourced from Scaleway Secret Manager) — never committed.
#
# Local dev uses the docker-compose.yml at the repo root, NOT this file.

services:
  api:
    image: ${REGISTRY_ENDPOINT}/api:latest
    container_name: coach-os-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Scaleway API credentials — used by the in-process Scaleway Secret
      # Manager configuration provider to fetch runtime config (DB connection
      # string, JWT key, SMTP creds, etc).
      SCW_DEFAULT_PROJECT_ID: ${SCW_DEFAULT_PROJECT_ID}
      SCW_DEFAULT_ORGANIZATION_ID: ${SCW_DEFAULT_ORGANIZATION_ID}
      SCW_ACCESS_KEY: ${SCW_ACCESS_KEY}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY}
      SCW_REGION: ${SCW_REGION:-fr-par}
      # The CoachOS app lives on app.coach-os.be (apex hosts the marketing site).
      App__FrontendBaseUrl: https://app.coach-os.be
      App__ConfirmationBaseUrl: https://app.coach-os.be/confirmation
      App__StudentMagicLinkBaseUrl: https://app.coach-os.be/auth/magic
      App__StandaloneLessonInvitationBaseUrl: https://app.coach-os.be/invitation

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - coach-os-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${REGISTRY_ENDPOINT}/frontend:latest
    container_name: coach-os-frontend
    restart: unless-stopped

    # Next.js redirects '/' to a locale-prefixed path (307), which wget --spider
    # treats as an error. Use node to treat anything < 500 as healthy.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - coach-os-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Marketing website served on coach-os.be (apex + www).
  # Pure SSR Next.js — has its own /api/contact and /api/waitlist server routes,
  # no calls to the CoachOS backend.
  website:
    image: ${REGISTRY_ENDPOINT}/website:latest
    container_name: coach-os-website
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - coach-os-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Live container log viewer at https://coach-os.be/_logs/ (basic auth).
  # Reads the host docker socket read-only — only sees containers, can't
  # exec into them or stop them.
  # Pinned to v8.x — last major with built-in basic auth via env vars.
  # v10 removed DOZZLE_USERNAME/PASSWORD in favor of a users.yml file.
  dozzle:
    image: amir20/dozzle:v8.13.4
    container_name: coach-os-dozzle
    restart: unless-stopped

    environment:
      DOZZLE_USERNAME: admin
      DOZZLE_PASSWORD: ${DOZZLE_PASSWORD}
      DOZZLE_BASE: /_logs
      DOZZLE_NO_ANALYTICS: "true"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # No healthcheck — dozzle uses a scratch-based image without wget/curl.
    # nginx is the entry point for users; it'll surface dozzle being down.

    networks:
      - coach-os-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: coach-os-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for Let's Encrypt http-01 challenges. Certbot writes
      # /.well-known/acme-challenge/<token> into this dir on the host;
      # nginx's apex/app vhosts serve those files via the matching
      # `location /.well-known/acme-challenge/` block. Required for
      # `certbot --webroot` (used by cert-expand and auto-renew).
      - /var/www/certbot:/var/www/certbot:ro

    depends_on:
      - api
      - frontend
      - website
      - dozzle

    networks:
      - coach-os-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  coach-os-network:
    driver: bridge
