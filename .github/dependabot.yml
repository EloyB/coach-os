# Dependabot: wekelijkse update-PR's per onderdeel, gegroepeerd zodat het
# beheersbaar blijft. Beveiligingsupdates (Dependabot security updates) komen
# los van dit schema, zodra er een melding is.
#
# cooldown: nieuwe versies pas voorstellen als ze een tijd uit zijn. Zo vangen
# we gekaapte of teruggetrokken releases op voor ze bij ons terechtkomen.
# Geldt niet voor beveiligingsupdates.
#
# ignore: we volgen LTS-versies van .NET en Node. Tussenversies (.NET 11/13,
# oneven Node) worden overgeslagen; de volgende LTS komt gewoon als PR.
# Grote sprongen die een bewuste upgrade vragen, staan als issue op de lijst
# (#327 TypeScript 7). Haal de regel hier weg
# zodra zo'n upgrade gedaan is.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node volgt de Node-versie in Docker (24); mee omhoog bij de volgende LTS (26).
      - dependency-name: "@types/node"
        versions: [">= 25"]
      # TS 7 wacht op typescript-eslint (geen JS-API in TS 7.0), zie #327.
      - dependency-name: typescript
        versions: [">= 7"]
    labels: [dependencies, frontend]

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      website-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node volgt de Node-versie in Docker (24); mee omhoog bij de volgende LTS (26).
      - dependency-name: "@types/node"
        versions: [">= 25"]
      # TS 7 wacht op typescript-eslint (geen JS-API in TS 7.0), zie #327.
      - dependency-name: typescript
        versions: [">= 7"]
    labels: [dependencies, website]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /website]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    cooldown:
      default-days: 14
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Enkel LTS: .NET 10 -> 12, Node 24 -> 26.
      - dependency-name: dotnet/sdk
        versions: [">= 11, < 12", ">= 13, < 14"]
      - dependency-name: dotnet/aspnet
        versions: [">= 11, < 12", ">= 13, < 14"]
      - dependency-name: node
        versions: [">= 23, < 24", ">= 25, < 26", ">= 27, < 28"]
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: terraform
    directory: /infrastructure/terraform
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    cooldown:
      default-days: 14
    groups:
      terraform-providers:
        patterns: ["*"]
    labels: [dependencies, infra]
