name: PR Check — Website

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '!website/**/*.md'
      - '.github/workflows/pr-check-website.yml'

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v7

      # Zelfde major als het productie-image (website/Dockerfile.prod: node:24-alpine).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_APP_URL: https://app.coach-os.be
          NEXT_TELEMETRY_DISABLED: '1'
