name: Website — Build, Push & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '!website/**/*.md'
      - '.github/workflows/website-build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud
  NAMESPACE: coach-os
  IMAGE_NAME: website

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Login to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCALEWAY_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (using Dockerfile.prod)
        uses: docker/build-push-action@v7
        with:
          context: ./website
          file: ./website/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://app.coach-os.be
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Wait for registry propagation
        run: sleep 15

      - name: Pull new image and restart website on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SCW_SECRET_KEY
          script: |
            set -euo pipefail
            cd /app
            echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
            docker image prune -f
            for i in 1 2 3; do
              if docker compose pull website; then break; fi
              [ $i -lt 3 ] && sleep 10 || exit 1
            done
            docker compose up -d --no-deps --force-recreate website
            # Wacht tot de nieuwe container echt antwoordt (max 120 s). Zonder deze
            # check bleef de deploy groen terwijl de API crashte bij het opstarten.
            wait_healthy() {
              svc="$1"; shift
              for i in $(seq 1 24); do
                if docker compose exec -T "$svc" "$@" >/dev/null 2>&1; then
                  echo "$svc is gezond na ongeveer $((i * 5)) s"
                  return 0
                fi
                sleep 5
              done
              echo "::error::$svc is 120 s na de deploy nog niet gezond"
              docker compose ps "$svc" || true
              docker compose logs --tail=100 "$svc" || true
              return 1
            }
            wait_healthy website node -e "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
            docker compose ps website
