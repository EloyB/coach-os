name: Backend — Build, Push & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/Scripts/**'
      - '!**.md'
      - '.github/workflows/backend-build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud
  NAMESPACE: coach-os
  IMAGE_NAME: api

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coachos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/CoachOS.slnx
      - run: dotnet build backend/CoachOS.slnx --no-restore --configuration Release
      - run: dotnet test backend/CoachOS.slnx --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=coachos_test;Username=postgres;Password=postgres"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCALEWAY_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-db:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch DB connection string from Scaleway Secret Manager
        uses: scaleway/action-scw-secret@v0.0.8
        with:
          secret-names: |
            DatabaseSettings__ConnectionString
          access-key: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          secret-key: ${{ secrets.SCALEWAY_SECRET_KEY }}
          default-project-id: ${{ secrets.SCALEWAY_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCALEWAY_DEFAULT_ORGANIZATION_ID }}
          default-region: fr-par

      - name: Export connection string for EF Core
        run: |
          echo "ConnectionStrings__DefaultConnection=$DATABASESETTINGS__CONNECTIONSTRING" >> "$GITHUB_ENV"

      - name: Restore + build (needed for dotnet-ef)
        run: |
          dotnet restore backend/CoachOS.slnx
          dotnet build backend/CoachOS.slnx --no-restore --configuration Release

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Apply migrations
        working-directory: backend
        run: $HOME/.dotnet/tools/dotnet-ef database update --project CoachOS.Infrastructure --startup-project CoachOS.API

  deploy:
    needs: [build-and-push, migrate-db]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Wait for registry propagation
        run: sleep 15

      - name: Pull new image and restart api on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SCW_SECRET_KEY
          script: |
            set -euo pipefail
            cd /app
            echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
            for i in 1 2 3; do
              if docker compose pull api; then break; fi
              [ $i -lt 3 ] && sleep 10 || exit 1
            done
            docker compose up -d --no-deps --force-recreate api
            sleep 5
            docker compose ps api
