name: Add SSH Key

on:
  workflow_dispatch: # only runs when manually triggered from GitHub UI

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Add new SSH key to authorized_keys
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            NEW_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB8KWvH2itmZKIik/UP4AgSShlsDFgb20ys7+bpQAm3h eloy@coach-os-scaleway"

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys

            # Check if key already exists to avoid duplicates
            if grep -qF "$NEW_KEY" ~/.ssh/authorized_keys; then
              echo "Key already present in authorized_keys — nothing to do."
            else
              echo "$NEW_KEY" >> ~/.ssh/authorized_keys
              echo "Key added successfully."
            fi

            echo ""
            echo "Current authorized_keys entries (public parts only):"
            awk '{print $1, $NF}' ~/.ssh/authorized_keys
