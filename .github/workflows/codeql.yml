name: CodeQL

# Statische beveiligingsanalyse van de eigen code (C#, TypeScript en de
# workflows zelf). Resultaten staan onder Security → Code scanning.
# Gratis voor publieke repositories.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # maandag 04:17 UTC: nieuwe regels ook op ongewijzigde code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none: geen dotnet build nodig, dus geen secrets of database.
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - marketing/**
              - "**/node_modules/**"
              - backend/CoachOS.Infrastructure/Migrations/**

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
