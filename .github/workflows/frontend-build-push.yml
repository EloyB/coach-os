name: Frontend — Build, Push & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/Dockerfile'        # local-dev Dockerfile only
      - '!frontend/e2e/**'
      - '!frontend/**/*.md'
      - '!frontend/playwright.config.ts'
      - '.github/workflows/frontend-build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud
  NAMESPACE: coach-os
  IMAGE_NAME: frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCALEWAY_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (using Dockerfile.prod)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://coach-os.be/api
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Wait for registry propagation
        run: sleep 15

      - name: Pull new image and restart frontend on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SCW_SECRET_KEY
          script: |
            set -euo pipefail
            cd /app
            echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
            for i in 1 2 3; do
              if docker compose pull frontend; then break; fi
              [ $i -lt 3 ] && sleep 10 || exit 1
            done
            docker compose up -d --no-deps frontend
            sleep 5
            docker compose ps frontend
