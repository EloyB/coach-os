name: Infrastructure — Deploy compose + nginx

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/docker-compose.yml'
      - 'infrastructure/nginx/**'
      - 'infrastructure/monitoring/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Compute REGISTRY_ENDPOINT
        run: echo "REGISTRY_ENDPOINT=rg.fr-par.scw.cloud/coach-os" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          REGISTRY_ENDPOINT: ${{ env.REGISTRY_ENDPOINT }}
          DOZZLE_PASSWORD: ${{ secrets.DOZZLE_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SCW_ACCESS_KEY,SCW_SECRET_KEY,SCW_DEFAULT_ORGANIZATION_ID,SCW_DEFAULT_PROJECT_ID,REGISTRY_ENDPOINT,DOZZLE_PASSWORD,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /app

            # Refuse to deploy an unauthenticated Grafana instance. Checked before
            # anything on disk is touched, so a missing secret is a true no-op.
            : "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER secret is required}"
            : "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD secret is required}"

            # Backup current config
            mkdir -p backups
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            cp docker-compose.yml "backups/docker-compose.yml.$TIMESTAMP" 2>/dev/null || true
            [ -d nginx ] && cp -r nginx "backups/nginx.$TIMESTAMP" || true
            [ -d monitoring ] && cp -r monitoring "backups/monitoring.$TIMESTAMP" || true

            # Pull latest infra config
            rm -rf /tmp/infra
            git clone --depth 1 --branch main https://github.com/${{ github.repository }}.git /tmp/infra

            cp -v /tmp/infra/infrastructure/docker-compose.yml ./docker-compose.yml
            rm -rf ./nginx
            mkdir -p ./nginx/conf.d
            cp -v /tmp/infra/infrastructure/nginx/nginx.conf ./nginx/nginx.conf
            cp -v /tmp/infra/infrastructure/nginx/conf.d/*.conf ./nginx/conf.d/
            rm -rf ./monitoring
            cp -rv /tmp/infra/infrastructure/monitoring ./monitoring

            # Write env file consumed by docker-compose interpolation.
            # umask 077 ensures only root can read.
            umask 077
            cat > /app/.env <<EOF
            REGISTRY_ENDPOINT=${REGISTRY_ENDPOINT}
            SCW_ACCESS_KEY=${SCW_ACCESS_KEY}
            SCW_SECRET_KEY=${SCW_SECRET_KEY}
            SCW_DEFAULT_ORGANIZATION_ID=${SCW_DEFAULT_ORGANIZATION_ID}
            SCW_DEFAULT_PROJECT_ID=${SCW_DEFAULT_PROJECT_ID}
            SCW_REGION=fr-par
            DOZZLE_PASSWORD=${DOZZLE_PASSWORD}
            GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
            GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            EOF

            # Validate compose syntax (rolls back on failure)
            if ! docker compose --env-file /app/.env config > /dev/null; then
              echo "Invalid docker-compose.yml — rolling back"
              cp "backups/docker-compose.yml.$TIMESTAMP" ./docker-compose.yml
              [ -d "backups/nginx.$TIMESTAMP" ] && { rm -rf ./nginx; cp -r "backups/nginx.$TIMESTAMP" ./nginx; }
              [ -d "backups/monitoring.$TIMESTAMP" ] && { rm -rf ./monitoring; cp -r "backups/monitoring.$TIMESTAMP" ./monitoring; }
              exit 1
            fi

            # Validate nginx syntax (one-off container)
            if ! docker run --rm \
                  --add-host api:127.0.0.1 \
                  --add-host frontend:127.0.0.1 \
                  --add-host dozzle:127.0.0.1 \
                  -v /app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
                  -v /app/nginx/conf.d:/etc/nginx/conf.d:ro \
                  -v /etc/letsencrypt:/etc/letsencrypt:ro \
                  nginx:alpine nginx -t; then
              echo "Invalid nginx config — rolling back"
              cp "backups/docker-compose.yml.$TIMESTAMP" ./docker-compose.yml
              rm -rf ./nginx
              cp -r "backups/nginx.$TIMESTAMP" ./nginx
              [ -d "backups/monitoring.$TIMESTAMP" ] && { rm -rf ./monitoring; cp -r "backups/monitoring.$TIMESTAMP" ./monitoring; }
              exit 1
            fi

            # Login to Scaleway Container Registry (idempotent — refreshes creds each deploy)
            echo "$SCW_SECRET_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

            # Pull latest images and bring everything up
            docker compose pull
            docker compose up -d

            # Force-recreate nginx so bind-mounted config changes are picked up
            # AND upstream DNS cache is reset. 'nginx -s reload' sometimes leaves
            # the process in a half-broken state when upstreams transitioned
            # down→up during a prior reload; a fresh container avoids this.
            #
            # Same for grafana: its dashboard/datasource provisioning config is
            # also bind-mounted, and Grafana only scans
            # /etc/grafana/provisioning/dashboards/*.yaml for NEW providers at
            # process startup — 'docker compose up -d' alone won't recreate it
            # when only those bind-mounted files changed, so a newly added
            # dashboard silently never appears until a real restart.
            #
            # Same reasoning for alloy (alloy-config.alloy) and loki
            # (loki-config.yml): both configs are bind-mounted too, and a
            # config-only change (e.g. the container-label relabel fix) never
            # reaches the running process without a restart — confirmed live
            # after the previous deploy, where grafana/nginx got recreated but
            # alloy kept running its stale config for 2+ hours, so Loki kept
            # rejecting every log batch as unlabeled.
            docker compose up -d --force-recreate nginx grafana alloy loki

            sleep 5
            docker compose ps
