services:
  postgres:
    image: postgres:17
    container_name: coachos_postgres
    environment:
      POSTGRES_DB: coachos_dev
      POSTGRES_USER: coachos
      POSTGRES_PASSWORD: coachos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachos -d coachos_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: coachos_smtp4dev
    ports:
      - "3001:80"    # Web UI
      - "1025:25"    # SMTP
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: coachos_backend
    ports:
      - "5142:5142"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=coachos_dev;Username=coachos;Password=coachos"
      Jwt__Key: "dev-secret-key-change-in-production-min-32-chars"
      Jwt__Issuer: "CoachOS-Dev"
      Jwt__Audience: "CoachOS-Dev"
      Jwt__ExpiryMinutes: "480"
      Email__SmtpHost: "smtp4dev"
      Email__SmtpPort: "25"
      Email__EnableSsl: "false"
      Email__FromAddress: "noreply@coach-hq.com"
      Email__FromName: "CoachOS"
      Email__Username: ""
      Email__Password: ""
      # Mollie Connect — leeg laten betekent dat de "Verbind met Mollie"-knop
      # een duidelijke "niet geconfigureerd"-fout teruggeeft. Voor lokaal
      # testen: zet MOLLIE_CLIENT_ID en MOLLIE_CLIENT_SECRET in .env (zie
      # .env.example). Mollie heeft localhost:5142/api/oauth/mollie/callback
      # al als redirect URI geregistreerd voor de Coach OS OAuth app.
      Mollie__ClientId: "${MOLLIE_CLIENT_ID:-}"
      Mollie__ClientSecret: "${MOLLIE_CLIENT_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      smtp4dev:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./backend/CoachOS.API
          target: /src/CoachOS.API
        - action: sync
          path: ./backend/CoachOS.Application
          target: /src/CoachOS.Application
        - action: sync
          path: ./backend/CoachOS.Domain
          target: /src/CoachOS.Domain
        - action: sync
          path: ./backend/CoachOS.Infrastructure
          target: /src/CoachOS.Infrastructure
        - action: rebuild
          path: ./backend/CoachOS.slnx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coachos_frontend
    ports:
      - "5317:5317"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5142/api"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: sync
          path: ./frontend/components
          target: /app/components
        - action: sync
          path: ./frontend/lib
          target: /app/lib
        - action: sync
          path: ./frontend/messages
          target: /app/messages
        - action: rebuild
          path: ./frontend/package.json

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coachos_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@coachos.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

volumes:
  postgres_data:
  pgadmin_data:
